name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            rust_target: aarch64-apple-darwin
            bun_url: https://github.com/oven-sh/bun/releases/latest/download/bun-darwin-aarch64.zip
            bun_archive: bun-darwin-aarch64
          - os: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            bun_url: https://github.com/oven-sh/bun/releases/latest/download/bun-linux-x64.zip
            bun_archive: bun-linux-x64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: install linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: download bun sidecar
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          cd /tmp
          curl -fsSL "${{ matrix.bun_url }}" -o bun.zip
          unzip -oq bun.zip
          cp "${{ matrix.bun_archive }}/bun" "$GITHUB_WORKSPACE/src-tauri/binaries/bun-${{ matrix.rust_target }}"
          chmod 755 "$GITHUB_WORKSPACE/src-tauri/binaries/bun-${{ matrix.rust_target }}"

      - run: bun install

      - run: bun run build

      - run: bun run bundle:server

      - run: bun run bundle:resources

      - name: cargo check (fast)
        working-directory: src-tauri
        run: cargo check --release --target ${{ matrix.rust_target }}
